<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Defensive guard against browser extensions that attempt to overwrite window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or non-configurable, silently continue
        }

        // Suppress external chrome-extension injection errors from crashing the app
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>SEVA FAIR - Fair Local Service Booking & Allocation</title>
    <meta name="description" content="Cooperative local service booking portal with transparent workload-balanced worker allocation, conflict prevention, and multi-role dashboards." />

  </body>
</html>
